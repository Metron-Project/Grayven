depends_on:
  - linting

when:
  - event: push
    branch: main
  - event: pull_request
    branch: main

matrix:
  include:
    - python: "3.11"
    - python: "3.12"
    - python: "3.13"
    - python: "3.14"
    - python: "3.15"

steps:
  pytest:
    image: "ghcr.io/astral-sh/uv:trixie"
    commands:
      - uv sync --locked --no-dev --all-extras --group tests -p ${python}
      - uv run --no-dev -p ${python} pytest
